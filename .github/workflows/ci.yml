name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 ./...
      - name: Compilar amd64 y arm64
        shell: pwsh
        run: ./scripts/build.ps1 -Version "0.0.0-ci" -Arch amd64,arm64
